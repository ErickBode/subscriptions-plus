[package]
name = "subscriptions-plus"
version = "1.1.0"
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
winreg = "0.55"
windows = { version = "0.62", features = [
  "Data_Xml_Dom",
  "Foundation",
  "Foundation_Collections",
  "UI_Notifications",
  "Win32_UI_Shell",
] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
opt-level = "s"
